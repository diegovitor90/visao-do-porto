spring.application.name=backend-springboot

# Piloto local com cadastros fictícios. Autenticação/perfis ainda pendentes.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:visaodoporto;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.mvc.problemdetails.enabled=true

visao.api.url=${VISION_API_URL:http://127.0.0.1:8000}
visao.api.conexao-timeout=2s
visao.api.leitura-timeout=15s
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
